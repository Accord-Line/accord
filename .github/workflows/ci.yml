name: Accord validation
on:
  push:
    paths: ['src/**', 'public/**', 'schemas/**', 'examples/**', 'tests/**', 'scripts/**', '*.config.*', 'tsconfig.json', 'index.html', 'package*.json', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-results
          path: test-results/
